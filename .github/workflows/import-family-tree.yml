name: Import share-safe family tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-family-tree.yml

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate deployed tree
        shell: bash
        run: |
          set -euo pipefail
          url="https://family-tree-joshclwrens-projects.vercel.app"
          ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 20 "$url" -o index.html.new; then
              if grep -q '<title>Wren Family Tree' index.html.new && \
                 grep -q 'Share-Safe Edition' index.html.new && \
                 grep -q 'const TREE =' index.html.new; then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          test "$ok" -eq 1
          mv index.html.new index.html

      - name: Remove temporary chunk experiment
        shell: bash
        run: rm -f site/tree-data-*.txt

      - name: Commit static viewer and remove bridge workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-family-tree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish share-safe Wren family tree viewer"
          git push
