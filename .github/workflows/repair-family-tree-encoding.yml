name: Repair family tree encoding
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show aea46fbee5073ea07f8f80f744efaf19f10239f9:index.html > index.html
      - run: python -m pip install --quiet ftfy
      - run: python -c "from pathlib import Path; from ftfy import fix_text; p=Path('index.html'); s=fix_text(p.read_text(encoding='utf-8')); assert '1,260 people' in s and '378 family groups' in s and 'Full family edition' in s and 'This viewer is one HTML file and works offline.' in s and '⌂ Start at Josh' in s and '← Back' in s; assert not any(x in s for x in ['Â·','Ã','â','â','â¦','â','ðª']); p.write_text(s, encoding='utf-8')"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix encoding in latest family tree"
            git push origin HEAD:main
          fi
