name: Repair family tree encoding

on:
  push:
    paths:
      - .github/workflows/repair-family-tree-encoding.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore latest intended family tree file
        run: git show aea46fbee5073ea07f8f80f744efaf19f10239f9:index.html > index.html

      - name: Repair mojibake without changing content
        run: |
          python -m pip install --quiet ftfy
          python - <<'PY'
          from pathlib import Path
          from ftfy import fix_text

          path = Path('index.html')
          original = path.read_text(encoding='utf-8')
          fixed = fix_text(original)

          # The broken version visibly contained these UTF-8-as-Latin-1 artifacts.
          suspicious = ['Â·', 'Ã', 'â', 'â', 'â¦', 'â', 'ðª']
          remaining = [marker for marker in suspicious if marker in fixed]
          if remaining:
              raise SystemExit(f'Encoding repair incomplete; remaining markers: {remaining}')

          # Guard the expected latest/full edition, not the older share-safe snapshot.
          required = [
              '1,260 people',
              '378 family groups',
              'Full family edition',
              'This viewer is one HTML file and works offline.',
              '⌂ Start at Josh',
              '← Back',
          ]
          missing = [marker for marker in required if marker not in fixed]
          if missing:
              raise SystemExit(f'Wrong family-tree version or repair damage; missing: {missing}')

          path.write_text(fixed, encoding='utf-8')
          print(f'Repaired {len(original.encode("utf-8"))} bytes -> {len(fixed.encode("utf-8"))} bytes')
          PY

      - name: Commit repaired latest file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix encoding in latest family tree"
          git push origin HEAD:main
