<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wren Family Tree</title>
<style>html,body{margin:0;height:100%;background:#f4f0e8;color:#28241f;font-family:system-ui,sans-serif}.loading{display:grid;place-items:center;height:100%;text-align:center;padding:24px}.loading strong{font-size:1.1rem}.loading small{display:block;margin-top:8px;color:#71685d}</style>
</head>
<body>
<div class="loading"><div><strong>Loading the Wren Family Tree…</strong><small>Preparing the full family archive.</small></div></div>
<script>
(async () => {
  const response = await fetch('./standalone.html', { cache: 'no-store' });
  if (!response.ok) throw new Error(`Could not load family tree (${response.status})`);
  let html = await response.text();

  // Repair only non-ASCII runs that are valid UTF-8 bytes misread as Latin-1.
  // Correct Unicode is left untouched because a lone Latin-1 character is not
  // valid UTF-8 and therefore fails the fatal decoder check.
  const decoder = new TextDecoder('utf-8', { fatal: true });
  html = html.replace(/[^\x00-\x7F]+/g, run => {
    const bytes = [];
    for (const ch of run) {
      const cp = ch.codePointAt(0);
      if (cp > 255) return run;
      bytes.push(cp);
    }
    try {
      return decoder.decode(Uint8Array.from(bytes));
    } catch {
      return run;
    }
  });

  document.open();
  document.write(html);
  document.close();
})().catch(error => {
  document.body.innerHTML = `<div class="loading"><div><strong>Family tree failed to load.</strong><small>${String(error.message || error)}</small></div></div>`;
  console.error(error);
});
</script>
</body>
</html>
